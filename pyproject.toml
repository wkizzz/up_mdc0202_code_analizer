[project]
name = "up-mdc0202-code-analizer"
version = "0.1.0"
description = "Модуль статического анализа Python-кода (УП 02.02, вариант 9)"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
extend-exclude = '''(\.venv|__pycache__|docs)'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.pylint.main]
py-version = "3.10"
fail-under = 8.0
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 60